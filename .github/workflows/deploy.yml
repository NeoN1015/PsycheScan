name: Deploy
on:
  push:
    branches: [Defense]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
defaults:
  run:
    working-directory: "WEBSITE FOR DATA GATHERING/Data_Gathering/psychescan-collect"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "WEBSITE FOR DATA GATHERING/Data_Gathering/psychescan-collect/package-lock.json"
      - run: npm ci
      - run: npm run build
      # The official PsycheScan dashboard (static files, no build) is published at /PsycheScan/official/
      - name: Add the official website
        run: |
          mkdir -p dist/official
          cp -r "../../../OFFICIAL WEBSITE/site/." dist/official/
          test -f dist/official/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "WEBSITE FOR DATA GATHERING/Data_Gathering/psychescan-collect/dist"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
